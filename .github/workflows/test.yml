name: test

on:
  - push
  - pull_request

jobs:
  linux-clang-sanitize-address:
    runs-on: ubuntu-22.04
    steps:
      - name: checkout
        uses: actions/checkout@v6
      - name: dependenices
        run: sudo apt-get update && sudo apt-get install libxml2-utils
      - name: test
        env:
          CC: clang
          PORTABLE: yes
        run: |
          ./configure --pedantic --sanitize address
          make -j`nproc` test

  linux-clang-sanitize-memory:
    runs-on: ubuntu-22.04
    steps:
      - name: checkout
        uses: actions/checkout@v6
      - name: dependenices
        run: sudo apt-get update && sudo apt-get install libxml2-utils
      - name: test
        env:
          CC: clang
          PORTABLE: yes
        run: |
          ./configure --pedantic --sanitize memory
          make -j`nproc` test

  linux-gcc-i386:
    runs-on: ubuntu-22.04
    steps:
      - name: checkout
        uses: actions/checkout@v6
      - name: dependenices
        run: sudo apt-get update && sudo apt-get install gcc-multilib libxml2-utils
      - name: test
        env:
          CC: gcc
          CFLAGS: -m32
          LDFLAGS: -m32
          PORTABLE: yes
        run: |
          ./configure --pedantic
          make -j`nproc` test

  linux-gcc-ndebug:
    runs-on: ubuntu-22.04
    steps:
      - name: checkout
        uses: actions/checkout@v6
      - name: dependenices
        run: sudo apt-get update && sudo apt-get install libxml2-utils
      - name: test
        env:
          CC: gcc
          CPPFLAGS: -DNDEBUG
          PORTABLE: yes
        run: |
          ./configure --pedantic
          make -j`nproc` test

  linux-gcc-sanitize-address:
    runs-on: ubuntu-22.04
    steps:
      - name: checkout
        uses: actions/checkout@v6
      - name: dependenices
        run: sudo apt-get update && sudo apt-get install libxml2-utils
      - name: test
        env:
          CC: gcc
          PORTABLE: yes
        run: |
          ./configure --pedantic --sanitize address
          make -j`nproc` test

  linux-gcc-valgrind:
    runs-on: ubuntu-22.04
    steps:
      - name: checkout
        uses: actions/checkout@v6
      - name: dependenices
        run: sudo apt-get update && sudo apt-get install libxml2-utils valgrind
      - name: test
        env:
          CC: gcc
          EXEC: valgrind
          PORTABLE: yes
          TESTFLAGS: -Tmemleak
        run: |
          ./configure --pedantic
          make -j`nproc` test
